# Render.com 배포 설정
# GitHub 저장소를 Render 에 연결하면 이 파일을 읽어 자동으로 구성합니다.
#
# 주의: 방 정보는 서버 메모리에 있으므로 인스턴스가 1개여야 합니다.
#       (무료 플랜은 기본 1개라 그대로 두면 됩니다)
services:
  - type: web
    name: family-bingo
    runtime: node
    plan: free
    region: singapore          # 한국에서 가장 가까운 지역
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
